<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>智能打卡系統</title>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root {
    --bg-color: #f0f4f8;
    --card-bg: #ffffff;
    --text-main: #2c3e50;
    --text-sub: #7f8c8d;
    --start-gradient: linear-gradient(135deg, #ff9f43, #ee5253);
    --end-gradient: linear-gradient(135deg, #3498db, #2980b9);
    --approve-gradient: linear-gradient(145deg, #8e44ad, #663399);
}

body {
    font-family: "Arial", "Noto Sans TC", sans-serif;
    background: var(--bg-color);
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    color: var(--text-main);
}

.app-container {
    width: 100%;
    max-width: 480px;
    min-height: 100vh;
    background: var(--bg-color);
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    padding: 16px 16px 32px 16px;
    gap: 16px;
}

.app-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 4px;
}
.user-profile-container {
    display: flex;
    align-items: center;
    gap: 12px;
}

.user-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: linear-gradient(135deg, #6c5ce7, #a29bfe);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 20px;
    font-weight: bold;
    box-shadow: 0 4px 10px rgba(108, 92, 231, 0.3);
    flex-shrink: 0;
}

.user-profile {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
#userInfo {
    font-size: 18px;
    font-weight: bold;
    color: var(--text-main);
}
.app-subtitle {
    font-size: 13px;
    font-weight: bold;
    color: var(--text-sub);
}

#statusInfo {
    font-size: 13px; 
    font-weight: bold;
    color: white;
    padding: 6px 12px; 
    border-radius: 20px;
    background: #95a5a6;
    text-align: center;
    white-space: nowrap;
    box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    flex-shrink: 0;
}

.dashboard-card {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 24px 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.15);
}

.clock-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: linear-gradient(145deg, #f8fafc, #edf2f7);
    padding: 14px 20px;
    border-radius: 16px;
    box-shadow: inset 0 2px 5px rgba(0,0,0,0.05), 0 4px 12px rgba(0,0,0,0.03);
    border: 1px solid #e2e8f0;
}

.time-box {
    background: #ffffff;
    padding: 8px 12px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
    border: 1px solid #edf2f7;
}

#timeHour, #timeMin, #timeSec {
    font-size: 34px;       
    font-weight: normal;   
    color: var(--text-main);
    font-family: "Courier New", Courier, monospace;
    letter-spacing: 1px;
}

.time-separator {
    font-size: 28px;
    font-weight: normal;
    color: #a0aec0;
    padding-bottom: 4px;
    animation: pulseSeparator 1.5s infinite;
}

@keyframes pulseSeparator {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
}

.buttons-container {
    display: flex;
    gap: 15px;
    width: 100%;
}
.buttons-container button {
    flex: 1;
    padding: 15px 0;
    font-size: 20px;
    font-weight: bold;
    border-radius: 12px;
    border: none;
    cursor: pointer;
    color: white;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}

#btnStart { background: var(--start-gradient); }
#btnEnd { background: var(--end-gradient); }

button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    box-shadow: none !important;
    transform: none !important;
}

button:not(:disabled):active {
    transform: scale(0.97);
}

.section-container {
    background: var(--card-bg);
    border-radius: 16px;
    padding: 18px;
    box-shadow: 0 10px 20px rgba(0,0,0,0.08);
    border: 1px solid #ddd;
}
.section-title {
    font-size: 16px;
    font-weight: bold;
    color: var(--text-main);
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    cursor: pointer;
    user-select: none;
}
.refresh-hint {
    font-size: 12px;
    font-weight: normal;
    color: var(--text-sub);
}
#todayRecords {
    display: flex;
    flex-direction: column;
    gap: 8px;
}
.record-item {
    background: #fafafa;
    border-radius: 10px;
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-left: 4px solid #3498db;
    box-sizing: border-box;
    font-size: 16px;
}
.record-info {
    display: flex;
    flex-direction: column;
    gap: 2px;
}
.record-status {
    font-size: 15px;
    font-weight: bold;
    color: #2c3e50;
}
.record-details {
    font-size: 12px;
    color: #7f8c8d;
}
.record-time {
    font-size: 18px;
    font-weight: bold;
    color: #2c3e50;
}
.records-empty {
    text-align: center;
    color: var(--text-sub);
    font-size: 15px;
    padding: 15px 0;
}

#btnApprove {
    padding: 14px 20px;
    font-size: 18px;
    font-weight: bold;
    border-radius: 10px;
    background: var(--approve-gradient);
    color: white;
    display: none;
    width: 100%;
    cursor: pointer;
    border: none;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    transition: all 0.2s;
}
#btnApprove:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 15px rgba(0,0,0,0.15);
}

.swal2-popup.custom-swal-popup {
    border-radius: 20px !important;
    padding: 24px !important;
    font-family: "Arial", "Noto Sans TC", sans-serif !important;
    box-shadow: 0 20px 40px rgba(0,0,0,0.2) !important;
}
.msg-status-box {
    margin-top: 12px;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    background: #f1f5f9;
    color: #475569;
}
.btn-retry-msg {
    margin-top: 8px;
    padding: 6px 14px;
    font-size: 13px;
    font-weight: bold;
    color: #fff;
    background: #e67e22;
    border: none;
    border-radius: 6px;
    cursor: pointer;
}
</style>
</head>
<body>

<div class="app-container">
  <div class="app-header">
    <div class="user-profile-container">
      <div class="user-avatar" id="userAvatar">👤</div>
      <div class="user-profile">
        <div id="userInfo">載入中...</div>
        <div class="app-subtitle" id="headerDate">載入日期中...</div>
      </div>
    </div>
    <div id="statusInfo">定位確認中…</div>
  </div>

  <div class="dashboard-card">
    <div class="clock-container">
      <div class="time-box"><span id="timeHour">00</span></div>
      <span class="time-separator">:</span>
      <div class="time-box"><span id="timeMin">00</span></div>
      <span class="time-separator">:</span>
      <div class="time-box"><span id="timeSec">00</span></div>
    </div>

    <div class="buttons-container">
      <button id="btnStart" disabled>定位中…</button>
      <button id="btnEnd" disabled>定位中…</button>
    </div>
  </div>

  <div class="section-container">
    <div class="section-title" onclick="refreshTodayRecords()">
      <span>📋 今日打卡紀錄</span>
      <span class="refresh-hint">點擊重整</span>
    </div>
    <div id="todayRecords"><div class="records-empty">正在載入紀錄…</div></div>
  </div>

  <button id="btnApprove">查看 | 簽核</button>
</div>
 
<script>
const API_ENDPOINT = "https://script.google.com/macros/s/AKfycbyIv9caRruu3RpfVq77UephHwg8CqHaNrvFKW1KtsXqLePVRkvg_wfhDZQH1XoNcHlC/exec";
const LIFF_ID = "2008786085-L1CtKqqv";
const STATIC_CACHE_KEY = "smart_clock_static_v1";

// 腳本載入立刻發送 ping 喚醒 GAS 容器（不等待 window.onload）
fetch(`${API_ENDPOINT}?ping=1`, { cache: "no-store" }).catch(() => {});

let userId = "", userName = "";
let dataReady = false;
let statusLoaded = false;
let isSubmitting = false;

let MANAGERS = [];
let COMPANIES = [];
let isManager = false;

let lastGPS = null;
let gpsErrorState = false;
let cachedIP = "";
let ipChecked = false;
let lastRangeStatus = null;

const btnStart = document.getElementById("btnStart");
const btnEnd = document.getElementById("btnEnd");
const userInfo = document.getElementById("userInfo");
const userAvatar = document.getElementById("userAvatar");
const statusInfo = document.getElementById("statusInfo");
const headerDate = document.getElementById("headerDate");
const todayRecords = document.getElementById("todayRecords");

// ====== 讀取前端本地靜態快取（秒開公司據點與主管名單） ======
try {
    const rawStatic = localStorage.getItem(STATIC_CACHE_KEY);
    if (rawStatic) {
        const parsed = JSON.parse(rawStatic);
        if (Array.isArray(parsed.companies)) COMPANIES = parsed.companies;
        if (Array.isArray(parsed.managers)) MANAGERS = parsed.managers;
    }
} catch (_) {}

function saveStaticCache() {
    try {
        localStorage.setItem(STATIC_CACHE_KEY, JSON.stringify({
            companies: COMPANIES,
            managers: MANAGERS,
            ts: Date.now()
        }));
    } catch (_) {}
}

// ====== Fetch Timeout 輔助函式 ======
async function fetchWithTimeout(url, options = {}, timeout = 8000) {
    const controller = new AbortController();
    const timer = setTimeout(() => controller.abort(), timeout);
    try {
        return await fetch(url, { ...options, signal: controller.signal });
    } finally {
        clearTimeout(timer);
    }
}

// ====== 更新日期時間與星期 ======
function updateDateTime() {
    const now = new Date();
    document.getElementById("timeHour").textContent = String(now.getHours()).padStart(2, '0');
    document.getElementById("timeMin").textContent = String(now.getMinutes()).padStart(2, '0');
    document.getElementById("timeSec").textContent = String(now.getSeconds()).padStart(2, '0');

    const dateStr = now.toLocaleDateString("zh-TW", { year: 'numeric', month: '2-digit', day: '2-digit' });
    const weekdayStr = now.toLocaleDateString("zh-TW", { weekday: 'long' });
    headerDate.textContent = `${dateStr} (${weekdayStr})`;
}
setInterval(updateDateTime, 1000);
updateDateTime();

function setButtonsLock(lock, textStart = "上班", textEnd = "下班") {
    if (isSubmitting) return;
    btnStart.disabled = lock;
    btnEnd.disabled = lock;
    btnStart.textContent = textStart;
    btnEnd.textContent = textEnd;
}

function getTodayString() {
    const d = new Date();
    return `${d.getFullYear()}/${String(d.getMonth() + 1).padStart(2, "0")}/${String(d.getDate()).padStart(2, "0")}`;
}

// ====== IP 預載（不阻塞定位） ======
async function preloadIP() {
    try {
        const res = await fetchWithTimeout("https://api.ipify.org?format=json", { cache: "no-store" }, 1500);
        const data = await res.json();
        if (data && data.ip) {
            cachedIP = data.ip;
        }
    } catch (_) {}
    ipChecked = true;
    evaluateLocalStatus();
}
function getIP() { return cachedIP || ""; }

// ====== Haversine 距離計算（本地 0ms 核對公司據點） ======
function calcDistance(lat1, lng1, lat2, lng2) {
    const R = 6371000;
    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLng = (lng2 - lng1) * Math.PI / 180;
    const a = Math.sin(dLat / 2) ** 2 +
              Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
              Math.sin(dLng / 2) ** 2;
    return 2 * R * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function checkCompanyLocal(lat, lng, ip) {
    let nearest = null;
    let distance = null;
    let ipMatched = false;
    const cleanIp = String(ip || "").trim();

    for (let i = 0; i < COMPANIES.length; i++) {
        const c = COMPANIES[i];
        if (cleanIp && Array.isArray(c.ips) && c.ips.includes(cleanIp)) {
            ipMatched = true;
            nearest = c;
            distance = 0;
            break;
        }
        if (lat !== null && lng !== null) {
            const d = calcDistance(c.lat, c.lng, lat, lng);
            if (distance === null || d < distance) {
                distance = d;
                nearest = c;
            }
        }
    }

    const canClockIn = ipMatched || (nearest && distance !== null && distance <= nearest.allow);
    return {
        nearestCompany: nearest,
        distance: distance !== null ? Math.round(distance) : null,
        ipMatched,
        rangeStatus: canClockIn ? "有效打卡區" : "無效打卡區"
    };
}

// ====== 本地即時判斷打卡區狀態（0ms，免等後端） ======
function evaluateLocalStatus() {
    if (!COMPANIES.length) return; // 尚未拿到任何據點清單（僅首次開啟時發生）

    const cleanIp = getIP();
    const hasGPS = lastGPS !== null;

    // 1. 先檢查 IP 是否命中公司據點（IP 命中即秒開，不必等室內 GPS）
    const check = checkCompanyLocal(hasGPS ? lastGPS.lat : null, hasGPS ? lastGPS.lng : null, cleanIp);

    if (check.ipMatched) {
        lastRangeStatus = "有效打卡區";
        statusLoaded = true;
        statusInfo.style.background = "#2ecc71";
        statusInfo.textContent = "有效打卡區";
        setButtonsLock(false, "上班", "下班");
        return;
    }

    // 2. IP 未命中且 GPS 尚未就緒
    if (!hasGPS) {
        if (gpsErrorState) {
            lastRangeStatus = "無效打卡區";
            statusLoaded = true;
            statusInfo.style.background = "#e74c3c";
            statusInfo.textContent = "未取得定位";
            if (isManager) {
                setButtonsLock(false, "上班 (主管)", "下班 (主管)");
            } else {
                setButtonsLock(true, "請開啟定位", "請開啟定位");
            }
        } else if (isManager) {
            // 主管免等定位即可操作
            lastRangeStatus = "無效打卡區";
            statusLoaded = true;
            statusInfo.style.background = "#95a5a6";
            statusInfo.textContent = "定位中…";
            setButtonsLock(false, "上班 (主管)", "下班 (主管)");
        } else {
            statusInfo.style.background = "#95a5a6";
            statusInfo.textContent = "定位中…";
            setButtonsLock(true, "定位中…", "定位中…");
        }
        return;
    }

    // 3. 已有 GPS：顯示距離與有效/無效狀態
    lastRangeStatus = check.rangeStatus;
    statusLoaded = true;

    if (check.rangeStatus === "有效打卡區") {
        statusInfo.style.background = "#2ecc71";
        statusInfo.textContent = "有效打卡區";
        setButtonsLock(false, "上班", "下班");
    } else {
        statusInfo.style.background = "#e74c3c";
        const distText = check.distance !== null ? ` (${check.distance} 公尺)` : "";
        statusInfo.textContent = "無效打卡區" + distText;
        if (isManager) {
            setButtonsLock(false, "上班 (主管)", "下班 (主管)");
        } else {
            setButtonsLock(true, "上班", "下班");
        }
    }
}

// ====== GPS 追蹤 ======
function initGPSWatcher() {
    if (!navigator.geolocation) {
        gpsErrorState = true;
        evaluateLocalStatus();
        return;
    }
    navigator.geolocation.watchPosition(pos => {
        gpsErrorState = false;
        lastGPS = { lat: pos.coords.latitude, lng: pos.coords.longitude };
        evaluateLocalStatus();
    }, err => {
        console.warn("GPS錯誤:", err);
        if (!lastGPS) {
            gpsErrorState = true;
            evaluateLocalStatus();
        }
    }, {
        enableHighAccuracy: true,
        maximumAge: 5000,
        timeout: 6000
    });
}

// ====== 渲染今日打卡紀錄 ======
function renderTodayRecords(data) {
    if (!data || !data.length) {
        todayRecords.innerHTML = `<div class="records-empty">今日尚無打卡紀錄</div>`;
        return;
    }

    const recordsHTML = data.map(r => {
        let color = r.status === "下班" ? "#2ecc71" : "#3498db";
        if (r.company && r.company.includes("錯誤")) color = "#e67e22";

        return `
            <div class="record-item" style="border-left-color: ${color};">
              <div class="record-info">
                <div class="record-status">${r.status}</div>
                <div class="record-details">${r.company || "未知位置"}</div>
              </div>
              <div class="record-time" style="color: ${color};">${r.time}</div>
            </div>
        `;
    }).join("");

    todayRecords.innerHTML = recordsHTML;
}

// ====== 單次合併初始化請求 (主管 + 據點 + 今日紀錄) ======
async function loadInitAppData(uid) {
    try {
        const res = await fetchWithTimeout(
            `${API_ENDPOINT}?action=initApp&userId=${encodeURIComponent(uid)}`,
            { cache: "no-store" },
            7000
        );
        const data = await res.json();

        if (Array.isArray(data.managers)) {
            MANAGERS = data.managers;
        }
        if (Array.isArray(data.companies)) {
            COMPANIES = data.companies;
        }
        saveStaticCache();

        isManager = MANAGERS.includes(uid);
        if (isManager) {
            document.getElementById("btnApprove").style.display = "block";
        }

        if (Array.isArray(data.todayRecords)) {
            renderTodayRecords(data.todayRecords);
        }
        dataReady = true;
        evaluateLocalStatus();
    } catch (err) {
        console.error("initApp 載入失敗:", err);
        todayRecords.innerHTML = `<div class="records-empty" style="color:#e74c3c;">資料載入失敗，點擊上方重整</div>`;
    }
}

async function updateTodayRecords(forceRefresh = false) {
    if (!userId) return;
    try {
        const url = `${API_ENDPOINT}?action=getToday&userId=${encodeURIComponent(userId)}&date=${getTodayString()}` +
                    (forceRefresh ? "&refresh=1" : "");
        const res = await fetchWithTimeout(url, { cache: "no-store" }, 6000);
        const data = await res.json();
        renderTodayRecords(data);
    } catch (err) {
        console.error(err);
        todayRecords.innerHTML = `<div class="records-empty" style="color: #e74c3c;">今日打卡紀錄讀取失敗</div>`;
    }
}

function refreshTodayRecords() {
    todayRecords.innerHTML = `<div class="records-empty">正在更新紀錄…</div>`;
    updateTodayRecords(true);
}

function applyProfileUI(name, pictureUrl, uid) {
    userId = uid;
    userName = name || "員工";
    userInfo.textContent = `${userName} 您好`;

    if (pictureUrl) {
        userAvatar.innerHTML = `<img src="${pictureUrl}" alt="avatar" style="width: 100%; height: 100%; border-radius: 50%; object-fit: cover;">`;
    } else if (userName) {
        userAvatar.textContent = userName.charAt(0);
    }

    isManager = MANAGERS.includes(userId);
    if (isManager) {
        document.getElementById("btnApprove").style.display = "block";
    }
}

// ====== LINE Flex 訊息組裝與自動重試傳送 ======
function buildFlexMessages(record) {
    const safeName = String(record.userName || "員工").trim() || "員工";
    const safeStatus = String(record.status || "打卡").trim() || "打卡";
    const safeDate = String(record.date || getTodayString()).trim();
    const safeTime = String(record.time || "00:00:00").trim();
    const safeCompany = String(record.company || "未知位置").trim() || "未知位置";

    let headerColor = "#3498db";
    if (safeStatus === "下班") headerColor = "#2ecc71";
    if (record.rangeStatus !== "有效打卡區") headerColor = "#e67e22";

    const reasonText = record.rangeStatus !== "有效打卡區" ? "異常原因：超出打卡區" : "";
    return [{
        type: 'flex',
        altText: `【打卡通知】${safeStatus}成功`,
        contents: {
            type: "bubble",
            header: {
                type: "box", layout: "vertical",
                contents: [{ type: "text", text: `${safeName} 已打卡`, weight: "bold", size: "lg", color: "#ffffff" }],
                backgroundColor: headerColor, paddingAll: "12px"
            },
            body: {
                type: "box", layout: "vertical", spacing: "md",
                contents: [
                    { type: "text", text: `狀態：${safeStatus}` },
                    { type: "text", text: `時間：${safeDate} ${safeTime}` },
                    { type: "text", text: `位置：${safeCompany}` },
                    ...(reasonText ? [{ type: "text", text: reasonText, color: "#e67e22" }] : [])
                ]
            }
        }
    }];
}

async function sendSelfMessageWithRetry(record, retries = 2) {
    if (typeof liff === "undefined" || !liff.isInClient()) {
        return { sent: false, reason: "not_in_client" };
    }

    const ctx = liff.getContext ? liff.getContext() : null;
    if (ctx && (ctx.type === "none" || ctx.type === "external")) {
        return { sent: false, reason: "no_chat_context" };
    }

    const messages = buildFlexMessages(record);
    let lastErr = null;

    for (let attempt = 0; attempt <= retries; attempt++) {
        try {
            await liff.sendMessages(messages);
            return { sent: true };
        } catch (err) {
            lastErr = err;
            console.warn(`LINE 訊息傳送第 ${attempt + 1} 次失敗:`, err);
            if (attempt < retries) {
                await new Promise(resolve => setTimeout(resolve, 300 * (attempt + 1)));
            }
        }
    }
    return { sent: false, reason: "send_failed", error: lastErr };
}

async function showClockResultAndSendMsg(title, iconType, detailHtml, record) {
    Swal.fire({
        icon: iconType,
        title: title,
        html: `
            ${detailHtml}
            <div id="msgSendStatus" class="msg-status-box">
                ⏳ 正在傳送 LINE 打卡通知...
            </div>
        `,
        showConfirmButton: false,
        allowOutsideClick: false,
        allowEscapeKey: false,
        backdrop: "rgba(0,0,0,0.5)",
        customClass: { popup: 'custom-swal-popup' }
    });

    const res = await sendSelfMessageWithRetry(record, 2);
    const statusBox = document.getElementById("msgSendStatus");

    if (res.sent) {
        if (statusBox) {
            statusBox.style.background = "#ecfdf5";
            statusBox.style.color = "#047857";
            statusBox.innerHTML = "✅ LINE 打卡通知已送出";
        }
        setTimeout(() => { if (Swal.isVisible()) Swal.close(); }, 1500);
    } else if (res.reason === "not_in_client" || res.reason === "no_chat_context") {
        if (statusBox) {
            statusBox.style.background = "#fef3c7";
            statusBox.style.color = "#92400e";
            statusBox.innerHTML = "ℹ️ 請從 LINE 聊天室開啟以自動回傳訊息";
        }
        Swal.update({ showConfirmButton: true, confirmButtonText: "確定", allowOutsideClick: true });
    } else {
        if (statusBox) {
            statusBox.style.background = "#fef2f2";
            statusBox.style.color = "#b91c1c";
            statusBox.innerHTML = `
                ⚠️ LINE 通知傳送失敗（打卡已寫入）<br>
                <button id="btnRetryLineMsg" class="btn-retry-msg">重試傳送通知</button>
            `;
            const retryBtn = document.getElementById("btnRetryLineMsg");
            if (retryBtn) {
                retryBtn.onclick = async () => {
                    retryBtn.disabled = true;
                    retryBtn.textContent = "傳送中...";
                    const retryRes = await sendSelfMessageWithRetry(record, 1);
                    if (retryRes.sent) {
                        statusBox.style.background = "#ecfdf5";
                        statusBox.style.color = "#047857";
                        statusBox.innerHTML = "✅ LINE 打卡通知已送出";
                        setTimeout(() => { if (Swal.isVisible()) Swal.close(); }, 1200);
                    } else {
                        retryBtn.disabled = false;
                        retryBtn.textContent = "重試傳送通知";
                    }
                };
            }
        }
        Swal.update({ showConfirmButton: true, confirmButtonText: "關閉", allowOutsideClick: true });
    }
}

function showClockLoading() {
    let countdown = 5;

    Swal.fire({
        html: `
            <div style="padding: 20px 10px 10px 10px; text-align: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;">
                <div style="position: relative; width: 90px; height: 90px; margin: 0 auto 20px auto;">
                    <div style="position: absolute; top: 0; left: 0; width: 90px; height: 90px; border: 3px solid #f1f5f9; border-radius: 50%; box-sizing: border-box;"></div>
                    <div style="position: absolute; top: 0; left: 0; width: 90px; height: 90px; border: 3px solid transparent; border-top-color: #2563eb; border-right-color: #3b82f6; border-radius: 50%; animation: proSpin 0.9s cubic-bezier(0.4, 0, 0.2, 1) infinite; box-sizing: border-box;"></div>
                    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 30px; font-weight: 700; color: #1e293b; font-family: 'Courier New', Courier, monospace; letter-spacing: -1px; animation: proPulse 1.2s ease-in-out infinite alternate;">
                        <span id="swalCountdown">${countdown}</span>
                    </div>
                </div>
                <h3 style="margin: 0 0 6px 0; color: #0f172a; font-size: 18px; font-weight: 600; letter-spacing: 0.3px;">系統打卡處理中</h3>
                <p style="margin: 0 0 16px 0; color: #64748b; font-size: 13px;">請稍後片刻勿關閉視窗</p>
                <div style="width: 100%; max-width: 180px; height: 4px; background: #e2e8f0; border-radius: 2px; margin: 0 auto; overflow: hidden;">
                    <div style="width: 40%; height: 100%; background: #2563eb; border-radius: 2px; animation: proBarMove 1.5s ease-in-out infinite;"></div>
                </div>
                <style>
                    @keyframes proSpin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
                    @keyframes proPulse { 0% { opacity: 0.85; transform: scale(0.98); } 100% { opacity: 1; transform: scale(1.02); } }
                    @keyframes proBarMove { 0% { transform: translateX(-100%); } 50% { transform: translateX(150%); } 100% { transform: translateX(250%); } }
                </style>
            </div>
        `,
        showConfirmButton: false,
        allowOutsideClick: false,
        allowEscapeKey: false,
        backdrop: "rgba(15, 23, 42, 0.65)",
        customClass: { popup: "custom-swal-popup" },
        didOpen: () => {
            window.swalTimer = setInterval(() => {
                countdown--;
                const el = document.getElementById("swalCountdown");
                if (el) el.textContent = countdown > 0 ? countdown : "0";
                if (countdown <= 0) clearInterval(window.swalTimer);
            }, 1000);
        },
        willClose: () => {
            if (window.swalTimer) clearInterval(window.swalTimer);
        }
    });
}

// ====== 打卡動作執行 ======
async function clockInOut(status) {
    if (isSubmitting) return;
    if (!userId || !statusLoaded) {
        Swal.fire({ icon: "info", title: "資料讀取中或定位中", timer: 1000, showConfirmButton: false, customClass: { popup: 'custom-swal-popup' } });
        return;
    }
    if (lastRangeStatus !== "有效打卡區" && !isManager) {
        Swal.fire({ icon: "warning", title: "目前為無效打卡區", text: "僅主管可打卡", timer: 1000, showConfirmButton: false, customClass: { popup: 'custom-swal-popup' } });
        return;
    }

    isSubmitting = true;
    btnStart.disabled = true;
    btnEnd.disabled = true;
    showClockLoading();

    try {
        const res = await fetchWithTimeout(API_ENDPOINT, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ userId, userName, ip: getIP(), gps: lastGPS || { lat: "", lng: "" }, status })
        }, 7000);

        const data = await res.json();
        const message = String(data?.message || "");
        const code = String(data?.code || "");

        const isMaxLimit = code === "MAX_LIMIT" || message.includes("上限");
        const isExplicitFail = data.success === false || message.includes("失敗") || message.includes("錯誤") || message.includes("忙碌");

        if (isMaxLimit || isExplicitFail) {
            Swal.close();
            Swal.fire({
                icon: "warning",
                title: isMaxLimit ? "已達打卡上限" : "打卡提示",
                html: `<span style="color:#c0392b;">${message || "打卡失敗，請檢查！"}</span>`,
                confirmButtonText: "確定",
                customClass: { popup: 'custom-swal-popup' }
            });
            return;
        }

        // 0ms 即時渲染後端帶回的今日紀錄
        if (Array.isArray(data.todayRecords)) {
            renderTodayRecords(data.todayRecords);
        } else {
            updateTodayRecords(true).catch(() => {});
        }

        const record = {
            userName,
            status: data.status || status,
            date: data.date || getTodayString(),
            time: data.time || new Date().toLocaleTimeString("zh-TW", { hour12: false }),
            company: data.company || "未知",
            rangeStatus: data.rangeStatus || lastRangeStatus
        };

        const iconType = record.rangeStatus !== "有效打卡區" ? "warning" : "success";
        const detailHtml = `<div style="font-size:15px;margin-top:6px;">時間：<strong>${record.date} ${record.time}</strong><br>位置：${record.company}</div>`;

        await showClockResultAndSendMsg(data.message || "打卡完成", iconType, detailHtml, record);

    } catch (err) {
        // 💡 逾時或網路異常 Fallback 強制成功機制
        console.warn("打卡逾時或網路中斷，啟動 Fallback 機制:", err);

        const now = new Date();
        const fallbackDate = getTodayString();
        const fallbackTime = now.toLocaleTimeString("zh-TW", { hour12: false });
        const localCheck = checkCompanyLocal(lastGPS ? lastGPS.lat : null, lastGPS ? lastGPS.lng : null, getIP());

        const record = {
            userName,
            status: status,
            date: fallbackDate,
            time: fallbackTime,
            company: localCheck.nearestCompany ? localCheck.nearestCompany.name : "處理中",
            rangeStatus: lastRangeStatus || localCheck.rangeStatus
        };

        setTimeout(() => {
            updateTodayRecords(true).catch(() => {});
        }, 1500);

        const detailHtml = `<div style="font-size:16px;margin-top:8px;"><strong>打卡時間：</strong><br><span style="color:#2980b9;font-size:18px;font-weight:bold;">${fallbackDate} ${fallbackTime}</span></div>`;
        await showClockResultAndSendMsg("🎉 打卡成功！", "success", detailHtml, record);

    } finally {
        isSubmitting = false;
        evaluateLocalStatus();
    }
}

btnStart.onclick = () => clockInOut("上班");
btnEnd.onclick = () => clockInOut("下班");

document.getElementById("btnApprove").onclick = () => {
    window.location.href = "https://script.google.com/macros/s/AKfycbz1FavWzmy5sl8iFCRfp7ZHQ_3EdFhTw_M093XAtq8ISIn9jiWrujfgZjjqRZxorTdkLQ/exec";
};

// ====== 頁面初始化（平行啟動 GPS + IP + LIFF + initApp） ======
async function bootstrap() {
    initGPSWatcher();
    preloadIP();
    evaluateLocalStatus(); // 若 localStorage 已有據點且位置已就緒可即刻驗證

    try {
        await liff.init({ liffId: LIFF_ID });
        if (!liff.isLoggedIn()) {
            await liff.login();
            return;
        }

        // 優先用 ID Token 同步取得 userId，讓 initApp 與 getProfile 同時執行
        let decoded = null;
        try { decoded = liff.getDecodedIDToken(); } catch (_) {}

        let initPromise = null;
        if (decoded && decoded.sub) {
            applyProfileUI(decoded.name, decoded.picture, decoded.sub);
            initPromise = loadInitAppData(decoded.sub);
        }

        const profile = await liff.getProfile();
        applyProfileUI(profile.displayName, profile.pictureUrl, profile.userId);

        if (!initPromise) {
            await loadInitAppData(profile.userId);
        } else {
            await initPromise;
        }
    } catch (error) {
        console.error("初始化失敗", error);
        userInfo.textContent = "初始化失敗";
    }
}

bootstrap();
